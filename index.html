<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujyalo has moved to Etayari</title>
<meta name="description" content="Ujyalo has closed. Everything continues at etayari.app.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta property="og:title" content="Ujyalo has moved to Etayari">
<meta property="og:description" content="Ujyalo has closed. Everything continues at etayari.app.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px 22px;
    font-family:'Outfit',system-ui,-apple-system,sans-serif;
    color:#1f2933;
    background:radial-gradient(at 50% 0%,rgba(15,118,110,.10) 0,transparent 60%),#f7faf8;
  }
  .wrap{max-width:440px;width:100%;text-align:center}
  .logo{height:46px;width:auto;margin-bottom:30px;opacity:.9}
  h1{
    font-family:'Fraunces',Georgia,serif;font-weight:900;
    font-size:clamp(30px,7vw,40px);line-height:1.15;letter-spacing:-.8px;
    margin-bottom:14px;
  }
  h1 em{font-style:normal;color:#0f766e}
  p{font-size:16.5px;line-height:1.65;color:#52606d;margin-bottom:30px}
  .btn{
    display:inline-block;background:#0f766e;color:#fff;text-decoration:none;
    font-weight:600;font-size:16px;padding:15px 32px;border-radius:12px;
    transition:background .15s;
  }
  .btn:hover{background:#0b5c55}
  .foot{margin-top:34px;font-size:13.5px;color:#8b93a0}
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/ujyalo-logo-transparent.png" alt="Ujyalo">
    <h1>Ujyalo has moved to <em>Etayari</em>.</h1>
    <p>Ujyalo is closed. Everything continues at Etayari.</p>
    <a class="btn" href="https://etayari.app">Go to etayari.app</a>
    <p class="foot">Thank you to everyone who used Ujyalo.</p>
  </main>
</body>
</html>
